name: 打包并发布

on:
  workflow_dispatch:

jobs:
  rebuild-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'
          check-latest: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.5'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./
        continue-on-error: true

      - name: Check and accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME" ] && ! sdkmanager --licenses --sdk_root="$ANDROID_HOME" | grep -q "All SDK package licenses accepted"; then
            echo "Accepting licenses..."
            yes | sdkmanager --licenses --sdk_root="$ANDROID_HOME" || echo "Failed, continuing..."
          else
            echo "Licenses accepted, skipping..."
          fi
        env:
          ANDROID_HOME: $HOME/android-sdk
        continue-on-error: true

      - name: Ensure Android build permissions
        run: |
          if [ -d "android" ]; then chmod -R 777 android/ || echo "Failed, continuing..."; fi
          if [ -f "android/gradlew" ]; then chmod +x android/gradlew || echo "Failed, continuing..."; else echo "gradlew not found"; fi
        working-directory: ./
        continue-on-error: true

      - name: Clean and regenerate build files
        run: |
          flutter clean || echo "Clean failed, continuing..."
          flutter pub get
        working-directory: ./
        continue-on-error: true

      - name: Generate incremental version tag
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v1.*' | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            VERSION=$(echo $LATEST_TAG | sed 's/v1\.//')
            MAJOR=1
            MINOR=$(echo $VERSION | cut -d. -f1)
            PATCH=$(echo $VERSION | cut -d. -f2)
            if [ $PATCH -ge 9 ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEW_TAG="v1.$MINOR.$PATCH"
          fi
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
        shell: bash

      - name: Update pubspec.yaml version
        run: |
          VERSION=$(echo ${{ env.NEW_TAG }} | sed 's/v//')
          PUBSPEC_FILE="pubspec.yaml"
          if [ -f "$PUBSPEC_FILE" ]; then
            sed -i "s/version: [0-9]\+\.[0-9]\+\.[0-9]\+\(+[0-9]\+\)\?/version: $VERSION/" "$PUBSPEC_FILE"
            echo "Updated version to $VERSION"
          else
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
        working-directory: ./

      - name: Restore keystore if available
        if: ${{ secrets.KEYSTORE && secrets.KEYSTORE_KEY_ALIAS && secrets.KEYSTORE_PASSWORD && secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > android/app/keystore.jks
        working-directory: ./
        continue-on-error: true

      - name: Build Android APK
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE && secrets.KEYSTORE_KEY_ALIAS && secrets.KEYSTORE_PASSWORD && secrets.KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ -f "android/app/keystore.jks" ]; then
            flutter build apk --release \
              --build-name=${{ env.NEW_TAG }} \
              --build-number=$(( $(git rev-list --count HEAD) + 1000 )) \
              --keystore-path=android/app/keystore.jks \
              --keystore-key-alias=${{ secrets.KEYSTORE_KEY_ALIAS }} \
              --keystore-password=${{ secrets.KEYSTORE_PASSWORD }} \
              --key-password=${{ secrets.KEY_PASSWORD }}
          else
            flutter build apk --release \
              --build-name=${{ env.NEW_TAG }} \
              --build-number=$(( $(git rev-list --count HEAD) + 1000 ))
          fi
        working-directory: ./

      - name: Clean up keystore
        if: ${{ secrets.KEYSTORE && secrets.KEYSTORE_KEY_ALIAS && secrets.KEYSTORE_PASSWORD && secrets.KEY_PASSWORD }}
        run: rm -f android/app/keystore.jks
        working-directory: ./
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'actions@github.com'
          git add pubspec.yaml
          git commit -m "Update pubspec.yaml to ${{ env.NEW_TAG }}" || echo "No changes"
          git push origin HEAD || echo "Push failed, continuing..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          body: |
            Automated Flutter Android APK release.
            Signed: ${{ secrets.KEYSTORE && secrets.KEYSTORE_KEY_ALIAS && secrets.KEYSTORE_PASSWORD && secrets.KEY_PASSWORD && 'true' || 'false' }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true